# ─────────────────────────────────────────────────────────────────────────────
# Cortex Gateway — NGINX Reverse Proxy Configuration (Production)
#
# Topology:
#   Internet → NGINX:80 → /api/* → backend:8000
#                      → /      → frontend static files
#
# Security:
#   - server_tokens off  (hide NGINX version)
#   - Security headers on all responses
#   - CSP compatible with React + inline styles (Tailwind/recharts)
#   - gzip for text assets
#
# Usage:
#   Mounted into the nginx:alpine container via docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────────────

# Hide NGINX version from error pages and response headers
server_tokens off;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    # CSP: allows React, Tailwind inline styles, recharts SVG, and API calls to same origin
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';"
        always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── API reverse proxy → backend ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Do not buffer large LLM responses
        proxy_buffering    off;
    }

    # ── Metrics / health pass-through (unauthenticated) ────────────────────
    location /metrics {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    location /health {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    location /version {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    # ── OpenAPI docs pass-through ───────────────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    # ── Frontend static files (SPA routing) ────────────────────────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # Cache static assets aggressively (Vite hashes filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
        }
    }
}
