name: cortex-gateway

# ─────────────────────────────────────────────────────────────────────────────
# Cortex Gateway — Docker Compose (Phase 1)
#
# Services:
#   postgres  — PostgreSQL 16 database
#   redis     — Redis 7 in-memory store
#   backend   — FastAPI application (Python 3.12)
#   frontend  — React / Vite dashboard (served via nginx)
#
# Usage:
#   docker compose up --build
#
# Ports (host):
#   5173  → frontend
#   8000  → backend  (also: /docs, /redoc)
#   5432  → postgres (local tooling)
#   6379  → redis    (local tooling)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cortex_gateway
      POSTGRES_USER: cortex_user
      POSTGRES_PASSWORD: cortex_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex_user -d cortex_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortex-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override env-file values with Docker service names
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cortex_gateway
      POSTGRES_USER: cortex_user
      POSTGRES_PASSWORD: cortex_dev_password
      DATABASE_URL: ""   # let the app auto-compose from the vars above
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: ""      # let the app auto-compose
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:5173,http://frontend:5173"
      OLLAMA_BASE_URL: "http://ollama:11434"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Ollama (Local / Self-Hosted LLM Runtime) ────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: cortex-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In Docker, frontend → backend goes through host networking.
        # For in-browser requests, the API calls go to the host machine port.
        VITE_API_URL: ""  # empty = relative URLs (nginx proxy or direct)
    container_name: cortex-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
