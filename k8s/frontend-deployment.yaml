apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-frontend
  namespace: cortex-gateway
  labels:
    app.kubernetes.io/name: cortex-gateway
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortex-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cortex-frontend
        app.kubernetes.io/name: cortex-gateway
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    101    # nginx user in nginx:alpine
        runAsGroup:   101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: cortex-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false   # nginx needs /var/cache/nginx writable
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu:    "50m"
              memory: "32Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds:       10
            failureThreshold:    3
            timeoutSeconds:      3

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds:       20
            failureThreshold:    3
            timeoutSeconds:      3

      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-frontend
  namespace: cortex-gateway
  labels:
    app.kubernetes.io/name: cortex-gateway
    app.kubernetes.io/component: frontend
spec:
  selector:
    app: cortex-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
