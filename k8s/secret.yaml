# ─────────────────────────────────────────────────────────────────────────────
# Cortex Gateway — Kubernetes Secret Template
#
# WARNING: This is a TEMPLATE only.
# DO NOT commit real secret values to version control.
#
# In production, populate secrets via:
#   Option A: kubectl create secret generic cortex-gateway-secrets \
#               --from-literal=POSTGRES_PASSWORD=<real-value> \
#               --from-literal=SECRET_KEY=<real-value> \
#               --namespace cortex-gateway
#
#   Option B: External secret manager (Vault, AWS Secrets Manager,
#             GCP Secret Manager) via external-secrets operator.
#
#   Option C: Sealed Secrets (Bitnami) — encrypt then commit.
#
# Values below are base64-encoded PLACEHOLDERS:
#   echo -n "change-me" | base64   →  Y2hhbmdlLW1l
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: cortex-gateway-secrets
  namespace: cortex-gateway
  labels:
    app.kubernetes.io/name: cortex-gateway
type: Opaque
data:
  # PostgreSQL password
  # Generate: python -c "import secrets; print(secrets.token_hex(16))"
  # Then base64: echo -n "your-password" | base64
  POSTGRES_PASSWORD: REPLACE_WITH_BASE64_ENCODED_PASSWORD

  # General secret key (32+ chars)
  # Generate: python -c "import secrets; print(secrets.token_hex(32))"
  SECRET_KEY: REPLACE_WITH_BASE64_ENCODED_SECRET_KEY

  # API key HMAC pepper (32+ chars)
  # Generate: python -c "import secrets; print(secrets.token_hex(32))"
  API_KEY_PEPPER: REPLACE_WITH_BASE64_ENCODED_PEPPER

  # Bootstrap token (for first organization creation)
  # Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"
  CORTEX_BOOTSTRAP_TOKEN: REPLACE_WITH_BASE64_ENCODED_BOOTSTRAP_TOKEN

  # Provider API keys (leave as empty string base64 = "" if not used)
  # echo -n "" | base64  →  (empty string)
  GEMINI_API_KEY: REPLACE_WITH_BASE64_ENCODED_GEMINI_KEY
  GROQ_API_KEY:   REPLACE_WITH_BASE64_ENCODED_GROQ_KEY
  OPENAI_API_KEY: REPLACE_WITH_BASE64_ENCODED_OPENAI_KEY

  # Grafana admin password (if deploying Grafana)
  GF_ADMIN_PASSWORD: REPLACE_WITH_BASE64_ENCODED_GRAFANA_PASSWORD
