apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-gateway-config
  namespace: cortex-gateway
  labels:
    app.kubernetes.io/name: cortex-gateway
data:
  # ── Application ──────────────────────────────────────────────────────────
  APP_NAME: "Cortex Gateway"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"

  # ── API Server ───────────────────────────────────────────────────────────
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # ── Database (host/port — credentials in Secret) ─────────────────────────
  POSTGRES_HOST: "your-managed-postgres-host"   # e.g. RDS, Cloud SQL endpoint
  POSTGRES_PORT: "5432"
  POSTGRES_DB:   "cortex_gateway"
  POSTGRES_USER: "cortex_user"

  # ── Redis (host/port — credentials in Secret if auth enabled) ────────────
  REDIS_HOST: "your-managed-redis-host"         # e.g. ElastiCache, Redis Cloud
  REDIS_PORT: "6379"

  # ── Logging ──────────────────────────────────────────────────────────────
  LOG_LEVEL: "INFO"

  # ── CORS ─────────────────────────────────────────────────────────────────
  CORS_ORIGINS: "https://your-domain.com"

  # ── Provider configuration (non-secret) ──────────────────────────────────
  GEMINI_ENABLED:   "true"
  GROQ_ENABLED:     "true"
  OPENAI_ENABLED:   "false"
  OLLAMA_ENABLED:   "true"
  OLLAMA_BASE_URL:  "http://ollama-service:11434"  # internal K8s service name
  PROVIDER_TIMEOUT_SECONDS: "30"

  # ── Routing (Phase 3) ────────────────────────────────────────────────────
  ROUTING_ENABLED:              "true"
  ROUTING_DEFAULT_MODE:         "auto"
  ROUTING_HEALTH_WEIGHT:        "0.30"
  ROUTING_SUCCESS_RATE_WEIGHT:  "0.30"
  ROUTING_LATENCY_WEIGHT:       "0.20"
  ROUTING_COST_WEIGHT:          "0.20"

  # ── Reliability (Phase 4) ────────────────────────────────────────────────
  RELIABILITY_TOTAL_REQUEST_TIMEOUT_SECONDS: "120"
  RELIABILITY_MAX_RETRIES:                   "2"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD:         "5"
  CIRCUIT_BREAKER_COOLDOWN_SECONDS:          "30.0"
  RELIABILITY_MAX_FAILOVER_ATTEMPTS:         "2"

  # ── Rate Limiting (Phase 6) ──────────────────────────────────────────────
  RATE_LIMIT_ENABLED:              "true"
  RATE_LIMIT_API_KEY_REQUESTS:     "100"
  RATE_LIMIT_API_KEY_WINDOW_SECONDS: "60"
  RATE_LIMIT_TEAM_REQUESTS:        "500"
  RATE_LIMIT_TEAM_WINDOW_SECONDS:  "60"
  RATE_LIMIT_ORG_REQUESTS:         "2000"
  RATE_LIMIT_ORG_WINDOW_SECONDS:   "60"

  # ── Budget (Phase 6) ─────────────────────────────────────────────────────
  BUDGET_ENABLED:                   "true"
  BUDGET_DEFAULT_POLICY:            "BLOCK"
  BUDGET_WARNING_THRESHOLD_PERCENT: "80"
  BUDGET_EXPOSE_REMAINING:          "false"

  # ── Observability (Phase 7) ──────────────────────────────────────────────
  METRICS_ENABLED:      "true"
  REQUEST_LOG_ENABLED:  "true"
  OTEL_ENABLED:         "false"
  OTEL_SERVICE_NAME:    "cortex-gateway"

  # ── Semantic Cache (Phase 9B) ────────────────────────────────────────────
  SEMANTIC_CACHE_ENABLED:               "false"
  SEMANTIC_CACHE_TTL_SECONDS:           "3600"
  SEMANTIC_CACHE_SIMILARITY_THRESHOLD:  "0.92"
  SEMANTIC_CACHE_EMBEDDING_PROVIDER:    "ollama"
  SEMANTIC_CACHE_EMBEDDING_MODEL:       "nomic-embed-text"

  # ── Bootstrap (Phase 5) ──────────────────────────────────────────────────
  # Set to false after initial organization creation
  CORTEX_BOOTSTRAP_ENABLED: "false"
