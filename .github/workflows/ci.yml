name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION:   "22"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend: lint, type-check, test, security scan
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint (ruff)
        run: ruff check app/ tests/

      # ── Type checking ──────────────────────────────────────────────────────
      - name: Type check (mypy)
        run: |
          mypy app/ --ignore-missing-imports --no-error-summary 2>&1 | tee mypy-report.txt || true
          echo "=== mypy summary ==="
          grep -E "^Found|^Success" mypy-report.txt || echo "See mypy-report.txt for details"
        # mypy runs but does NOT fail CI — see pyproject.toml for known typing debt.
        # Intentional: typing debt is documented, not silently hidden.
        continue-on-error: true

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Run backend tests
        env:
          # Test environment — no live provider credentials required
          ENVIRONMENT:   testing
          SECRET_KEY:    ci-test-secret-key-minimum-32-chars-required
          API_KEY_PEPPER: ci-test-pepper-minimum-32-chars-required
          CORTEX_BOOTSTRAP_TOKEN: ci-test-bootstrap-token
          # Providers disabled in CI — all tests use mocks
          GEMINI_ENABLED: "false"
          GROQ_ENABLED:   "false"
          OLLAMA_ENABLED: "false"
          OPENAI_ENABLED: "false"
          # Disable external services in unit tests
          REQUEST_LOG_ENABLED:    "false"
          METRICS_ENABLED:        "false"
          OTEL_ENABLED:           "false"
          SEMANTIC_CACHE_ENABLED: "false"
          RATE_LIMIT_ENABLED:     "false"
          BUDGET_ENABLED:         "false"
        run: |
          python -m pytest tests/ --tb=short -q \
            --ignore=tests/test_chat_api.py \
            --ignore=tests/test_endpoints.py \
            --ignore=tests/test_auth_security_leakage.py \
            --ignore=tests/test_auth_lifecycle.py \
            --ignore=tests/test_observability.py \
            --ignore=tests/test_budget.py

      # ── Note on excluded test files ──────────────────────────────────────────
      # The following test files require a live DB/Redis session or opentelemetry
      # SDK installed. They are excluded from CI until service containers are added:
      #   test_chat_api.py              — requires OTel + DB session
      #   test_endpoints.py             — requires OTel + DB session
      #   test_auth_lifecycle.py        — requires DB session (SQLAlchemy async)
      #   test_auth_security_leakage.py — requires DB session
      #   test_observability.py         — requires OTel SDK installed
      #   test_budget.py                — requires DB session
      # These are pre-existing limitations tracked as known issues.

      # ── Dependency security scan ─────────────────────────────────────────
      - name: Security scan (pip-audit)
        run: |
          pip-audit --requirement requirements.txt --format=cyclonedx-json \
            --output pip-audit-report.json 2>&1 || pip-audit --requirement requirements.txt || true
        continue-on-error: true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend: lint, build, security scan
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true  # ESLint errors are reported but don't block build

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build production bundle
        env:
          VITE_API_URL: ""    # relative URLs — compatible with NGINX proxy
        run: npm run build

      # ── Dependency security scan ─────────────────────────────────────────
      - name: Security scan (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true  # report findings, don't block CI

  # ─────────────────────────────────────────────────────────────────────────
  # Docker: verify both images build successfully
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file:    ./backend/Dockerfile
          push:    false
          tags:    cortex-backend:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file:    ./frontend/Dockerfile
          push:    false
          tags:    cortex-frontend:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            VITE_API_URL=

      - name: Inspect backend image
        run: |
          docker run --rm cortex-backend:ci python --version
          echo "Backend image built successfully"

      - name: Inspect frontend image (check nginx starts)
        run: |
          CONTAINER=$(docker run -d cortex-frontend:ci)
          sleep 3
          docker logs $CONTAINER 2>&1
          docker stop $CONTAINER
          echo "Frontend image built and started successfully"

  # ─────────────────────────────────────────────────────────────────────────
  # Secret scanning (gitleaks)
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for secret scanning

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # report findings, surface in summary
