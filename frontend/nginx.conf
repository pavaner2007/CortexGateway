# ─────────────────────────────────────────────────────────────────────────────
# Cortex Gateway — Frontend NGINX Config (standalone container)
#
# This config is for the frontend-only container serving the React SPA.
# In production, the full nginx/nginx.conf reverse proxy handles both
# frontend (static) and backend (/api/*) routing.
#
# Listens on port 8080 (non-privileged, runs as nginx user).
# ─────────────────────────────────────────────────────────────────────────────

server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:; font-src 'self'; object-src 'none'; frame-ancestors 'none';"
        always;

    # SPA routing — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-bust for Vite-hashed assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}
