# ─────────────────────────────────────────────────────────────────────────────
# Cortex Gateway — Python Project Configuration
#
# Tools configured here:
#   ruff   — fast Python linter (replaces flake8/isort/pyupgrade)
#   mypy   — static type checker
#   pytest — test runner (settings also in pytest.ini for backwards compat)
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
# Python target version — must match runtime Dockerfile (python:3.12-slim)
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    # Style / formatter concerns
    "E501",   # line too long — handled by formatter, not linter
    # FastAPI patterns
    "B008",   # function call in default argument (FastAPI Depends pattern)
    # Readability choices kept as-is
    "SIM117", # nested with statements
    "SIM105", # use contextlib.suppress — try/except is clearer in most cases here
    "SIM108", # ternary operator — explicit if/else preferred for readability
    "SIM102", # collapsible if — explicit nesting preferred
    # Raise chaining — existing API exception pattern (raise HTTPException inside except)
    # These are intentional: HTTPException is not an error-chain situation
    "B904",
    # zip() without strict= — pre-existing; adding strict would change behavior
    "B905",
    # assert isinstance() in tests — B017 false positive on pytest.raises blocks
    "B017",
    # Unused variables in tests and some service stubs
    "F841",
    # Module-level imports not at top (deferred imports after init calls)
    "E402",
    # Deprecated imports still needed for runtime compat
    "UP035",
    # StrEnum replace — requires Python 3.11+ refactor, deferred
    "UP042",
    # Unnecessary double cast — pre-existing, low risk
    "C414",
    # Duplicate dict key literal in tests (intentional collision test)
    "F601",
    # Unnecessary dict() call
    "C408",
    # Undefined name — SQLAlchemy forward refs use # type: ignore[name-defined]
    "F821",
]

[tool.ruff.lint.per-file-ignores]
# Test files: allow assert statements, unused imports for fixtures
"tests/**" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─────────────────────────────────────────────────────────────────────────────
# mypy — static type checking
#
# Known typing debt:
#   - app/observability/tracing.py: opentelemetry stubs not in dev environment
#   - app/providers/*: third-party SDK types incomplete
#   - Some SQLAlchemy async patterns require sqlalchemy[mypy] plugin
#
# mypy is run in CI with --ignore-missing-imports to avoid false failures from
# missing third-party stubs (opentelemetry, google-generativeai, groq, etc.)
# ─────────────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = false

# Ignore missing stubs for third-party packages not shipping inline types
ignore_missing_imports = true

# Enforce typed return values for our own code
disallow_untyped_defs = false    # gradual adoption — too many violations currently
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = true

# Known typing limitations (document, not suppress blindly):
# - opentelemetry SDK stubs absent in test environment
# - google-generativeai has partial stubs
# - groq SDK has partial stubs
# These are accepted limitations; see docs/deployment.md Known Limitations.

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "google.generativeai.*",
    "groq.*",
    "prometheus_client.*",
    "loguru.*",
    "asyncpg.*",
    "aiosqlite.*",
    "respx.*",
]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
