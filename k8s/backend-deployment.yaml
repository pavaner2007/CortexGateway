apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-backend
  namespace: cortex-gateway
  labels:
    app.kubernetes.io/name: cortex-gateway
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortex-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cortex-backend
        app.kubernetes.io/name: cortex-gateway
        app.kubernetes.io/component: backend
    spec:
      # ── Security context ────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000    # cortex user created in Dockerfile
        runAsGroup:   1000
        fsGroup:      1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          # Replace with your registry image:
          image: cortex-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # ── Security ────────────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false   # app writes logs to stdout; no FS writes needed
            capabilities:
              drop: ["ALL"]

          # ── Resource limits ─────────────────────────────────────────────
          # NOTE: tune these based on actual load measurements.
          resources:
            requests:
              cpu:    "250m"
              memory: "256Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"

          # ── Environment: non-sensitive from ConfigMap ───────────────────
          envFrom:
            - configMapRef:
                name: cortex-gateway-config

          # ── Environment: sensitive from Secret ──────────────────────────
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cortex-gateway-secrets
                  key:  POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-gateway-secrets
                  key:  SECRET_KEY
            - name: API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: cortex-gateway-secrets
                  key:  API_KEY_PEPPER
            - name: CORTEX_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-gateway-secrets
                  key:  CORTEX_BOOTSTRAP_TOKEN
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-gateway-secrets
                  key:  GEMINI_API_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-gateway-secrets
                  key:  GROQ_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-gateway-secrets
                  key:  OPENAI_API_KEY

          # ── Readiness probe ─────────────────────────────────────────────
          # Checks PostgreSQL + Redis connectivity — pod receives traffic only
          # when fully ready to serve.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds:       10
            failureThreshold:    3
            successThreshold:    1
            timeoutSeconds:      5

          # ── Liveness probe ──────────────────────────────────────────────
          # Checks only that the process is responsive (not DB/Redis).
          # Uses /version (lightweight, no external dependency) to avoid
          # restarting healthy pods due to transient DB/Redis outages.
          livenessProbe:
            httpGet:
              path: /version
              port: 8000
            initialDelaySeconds: 30
            periodSeconds:       20
            failureThreshold:    3
            successThreshold:    1
            timeoutSeconds:      5

          # ── Startup probe ───────────────────────────────────────────────
          # Give the app up to 60s to start before liveness kicks in.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds:       10
            failureThreshold:    6
            timeoutSeconds:      5

      # Graceful shutdown: Kubernetes sends SIGTERM → uvicorn handles it
      terminationGracePeriodSeconds: 30
